<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGamePay Perú</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0f172a;
color:white;
}

header{
background:#111827;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:30px;
font-weight:bold;
color:#00b4ff;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
}

.hero{
text-align:center;
padding:80px 20px;
}

.hero h1{
font-size:50px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
margin-bottom:30px;
}

.btn{
background:#00b4ff;
padding:15px 30px;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

.juegos{
padding:50px 20px;
}

.juegos h2{
text-align:center;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
}

.card h3{
margin-bottom:15px;
}

.card button{
background:#00b4ff;
border:none;
padding:12px 25px;
color:white;
border-radius:8px;
cursor:pointer;
margin-top:15px;
}

footer{
margin-top:50px;
background:#111827;
padding:20px;
text-align:center;
}
</style>

</head>
<body>

<header>

<div class="logo">JGamePay Perú</div>

<nav>
<a href="#">Inicio</a>
<a href="#">Juegos</a>
<a href="#">Gift Cards</a>
<a href="#">Contacto</a>
</nav>

</header>

<section class="hero">

<h1>Recargas y Gift Cards</h1>

<p>Compra rápido, fácil y seguro.</p>

<a class="btn" href="#">Comprar Ahora</a>

</section>

<section class="juegos">

<h2>Juegos Populares</h2>

<div class="grid">

<div class="card">
<h3>Free Fire</h3>
<p>Diamantes</p>
<button>Comprar</button>
</div>

<div class="card">
<h3>Roblox</h3>
<p>Robux</p>
<button>Comprar</button>
</div>

<div class="card">
<h3>Mobile Legends</h3>
<p>Diamantes</p>
<button>Comprar</button>
</div>

<div class="card">
<h3>PUBG Mobile</h3>
<p>UC</p>
<button>Comprar</button>
</div>

</div>

</section>

<footer>

© 2026 JGamePay Perú

</footer>

</body>
</html>
